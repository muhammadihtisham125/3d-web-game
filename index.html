<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Roller 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<style>
  :root {
    --bg-void: #0B0E1A;
    --panel-bg: rgba(18, 24, 44, 0.72);
    --panel-border: rgba(77, 232, 214, 0.3);
    --glow-cyan: #4DE8D6;
    --glow-magenta: #FF6B9D;
    --glow-gold: #FFD166;
    --text-primary: #F0F4FF;
    --text-muted: #8B93B8;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg-void);
    font-family: var(--font-body);
    overflow: hidden;
    overscroll-behavior: none;
  }

  #game-canvas { position: fixed; inset: 0; display: block; }

  .overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    padding: 24px;
  }

  .hidden { display: none !important; }

  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 0 60px rgba(77, 232, 214, 0.12), 0 20px 40px rgba(0,0,0,0.4);
    padding: 40px 36px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    animation: rise 0.6s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .panel { animation: none; }
    .btn-primary { transition: none; }
  }

  .eyebrow {
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--glow-cyan);
    margin: 0 0 10px;
    font-weight: 600;
  }

  h1.title {
    font-family: var(--font-display);
    font-size: clamp(32px, 8vw, 44px);
    font-weight: 700;
    color: var(--text-primary);
    margin: 0 0 14px;
    text-shadow: 0 0 30px rgba(77, 232, 214, 0.5);
    letter-spacing: -0.5px;
  }

  p.desc {
    color: var(--text-muted);
    font-size: 14.5px;
    line-height: 1.6;
    margin: 0 0 22px;
  }

  .controls-hint {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }

  .hint-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }

  .key {
    font-family: var(--font-display);
    font-size: 11px;
    color: var(--text-primary);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 5px 8px;
    min-width: 20px;
  }

  .hint-label { font-size: 10.5px; color: var(--text-muted); }

  .btn-primary {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    color: #06181A;
    background: var(--glow-cyan);
    border: none;
    border-radius: 999px;
    padding: 15px 42px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(77, 232, 214, 0.55);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    letter-spacing: 0.5px;
  }
  .btn-primary:hover { transform: scale(1.04); box-shadow: 0 0 40px rgba(77, 232, 214, 0.75); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:focus-visible { outline: 3px solid var(--glow-cyan); outline-offset: 3px; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  .hud-pill {
    position: absolute;
    top: 18px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 10px 18px;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    color: var(--text-primary);
  }
  #gem-hud { left: 18px; }
  #time-hud { right: 18px; }
  #gem-hud .hud-icon { color: var(--glow-magenta); }
  #time-hud .hud-icon { color: var(--glow-gold); }

  #fall-toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    background: var(--panel-bg);
    border: 1px solid rgba(255, 107, 157, 0.4);
    border-radius: 999px;
    padding: 8px 20px;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--glow-magenta);
    z-index: 6;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #fall-toast.show { opacity: 1; }

  #mobile-controls {
    position: fixed; bottom: 22px; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 22px; z-index: 8; pointer-events: none;
  }

  .dpad {
    display: grid;
    grid-template-columns: 52px 52px 52px;
    grid-template-rows: 52px 52px 52px;
    gap: 4px;
    pointer-events: auto;
  }

  .dbtn {
    background: rgba(18, 24, 44, 0.65);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    color: var(--glow-cyan);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
    user-select: none;
    transition: background 0.1s ease, transform 0.1s ease;
  }
  .dbtn:active, .dbtn.active { background: rgba(77, 232, 214, 0.25); transform: scale(0.94); }
  .dbtn.up { grid-column: 2; grid-row: 1; }
  .dbtn.left { grid-column: 1; grid-row: 2; }
  .dbtn.right { grid-column: 3; grid-row: 2; }
  .dbtn.down { grid-column: 2; grid-row: 3; }

  #jump-btn {
    width: 74px; height: 74px;
    border-radius: 50%;
    background: rgba(255, 107, 157, 0.18);
    border: 1px solid rgba(255, 107, 157, 0.45);
    backdrop-filter: blur(10px);
    color: var(--glow-magenta);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    transition: background 0.1s ease, transform 0.1s ease;
  }
  #jump-btn:active, #jump-btn.active { background: rgba(255, 107, 157, 0.35); transform: scale(0.94); }

  .stat-row { display: flex; justify-content: center; gap: 28px; margin-bottom: 24px; }
  .stat { text-align: center; }
  .stat-val { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--text-primary); }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 2px; }

  @media (max-width: 480px) {
    .panel { padding: 32px 24px; }
    .dpad { grid-template-columns: 46px 46px 46px; grid-template-rows: 46px 46px 46px; }
    #jump-btn { width: 64px; height: 64px; }
  }

  @media (min-width: 900px) {
    #mobile-controls { opacity: 0.55; transition: opacity 0.2s ease; }
    #mobile-controls:hover { opacity: 1; }
  }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="hud" class="hidden">
  <div id="gem-hud" class="hud-pill"><span class="hud-icon">◆</span><span id="gem-count">0 / 0</span></div>
  <div id="time-hud" class="hud-pill"><span class="hud-icon">◷</span><span id="time-count">0.0s</span></div>
</div>

<div id="fall-toast">Respawning…</div>

<div id="start-screen" class="overlay">
  <div class="panel">
    <p class="eyebrow">3D Web Game</p>
    <h1 class="title">Neon Roller</h1>
    <p class="desc">Guide your energy orb across the drifting platforms. Collect gems, dodge the rotating barriers, and reach the golden portal at the end of the circuit.</p>
    <div class="controls-hint">
      <div class="hint-item"><span class="key">W A S D</span><span class="hint-label">Move</span></div>
      <div class="hint-item"><span class="key">SPACE</span><span class="hint-label">Jump</span></div>
    </div>
    <button class="btn-primary" id="start-btn">Start Run</button>
  </div>
</div>

<div id="win-screen" class="overlay hidden">
  <div class="panel">
    <p class="eyebrow">Circuit Complete</p>
    <h1 class="title">Portal Reached</h1>
    <div class="stat-row">
      <div class="stat"><div class="stat-val" id="final-time">0.0s</div><div class="stat-label">Time</div></div>
      <div class="stat"><div class="stat-val" id="final-gems">0/0</div><div class="stat-label">Gems</div></div>
    </div>
    <button class="btn-primary" id="restart-btn">Run Again</button>
  </div>
</div>

<div id="mobile-controls" class="hidden">
  <div class="dpad">
    <div class="dbtn up" data-dir="forward">▲</div>
    <div class="dbtn left" data-dir="left">◀</div>
    <div class="dbtn right" data-dir="right">▶</div>
    <div class="dbtn down" data-dir="back">▼</div>
  </div>
  <div id="jump-btn">JUMP</div>
</div>

<script type="module">
import * as THREE from 'three';

/* ---------- Track definition (z-ranges are contiguous except two deliberate gaps) ---------- */
const segments = [
  { x: 0,    z: 0,    w: 6,   d: 8, checkpoint: true },
  { x: 0.8,  z: 7,    w: 5,   d: 6 },
  { x: 1.5,  z: 13,   w: 4.5, d: 6 },
  { x: 0.5,  z: 19,   w: 4,   d: 6 },
  { x: -0.5, z: 25,   w: 4,   d: 6 },
  // gap of 3.5
  { x: -1,   z: 34.5, w: 3.5, d: 6, checkpoint: true },
  { x: 0,    z: 40,   w: 3.5, d: 5 },
  { x: 1,    z: 45,   w: 3,   d: 5 },
  // gap of 3.5
  { x: 0.5,  z: 53.5, w: 3,   d: 5, checkpoint: true },
  { x: -0.5, z: 58.5, w: 3,   d: 5 },
  { x: 0,    z: 63.5, w: 3,   d: 5 },
  { x: 0,    z: 70.5, w: 7,   d: 9, isGoal: true },
];

const gemLocalOffsets = [[0.8, 1.1, -1], [-0.8, 1.1, 1]];
const obstacleSegmentIndices = [2, 6, 9];

/* ---------- Renderer / Scene / Camera ---------- */
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e1a);
scene.fog = new THREE.FogExp2(0x0b0e1a, 0.018);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 5, -7);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- Lighting ---------- */
scene.add(new THREE.AmbientLight(0x4a5a8f, 0.9));

const keyLight = new THREE.DirectionalLight(0x9fe8ff, 1.1);
keyLight.position.set(8, 14, -6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.left = -20;
keyLight.shadow.camera.right = 20;
keyLight.shadow.camera.top = 20;
keyLight.shadow.camera.bottom = -20;
keyLight.shadow.camera.far = 60;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0xff6b9d, 0.6, 40);
rimLight.position.set(-6, 6, 10);
scene.add(rimLight);

/* ---------- Starfield ---------- */
{
  const starCount = 600;
  const starGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 200;
    positions[i * 3 + 1] = Math.random() * 80 + 5;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 200 + 40;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xaebfff, size: 0.6, sizeAttenuation: true, transparent: true, opacity: 0.7 });
  scene.add(new THREE.Points(starGeo, starMat));
}

/* ---------- Track meshes ---------- */
const platformMat = new THREE.MeshStandardMaterial({ color: 0x1b2340, roughness: 0.6, metalness: 0.2, emissive: 0x0a1428, emissiveIntensity: 0.4 });
const goalPlatformMat = new THREE.MeshStandardMaterial({ color: 0x2a2418, roughness: 0.5, metalness: 0.3, emissive: 0x3a2a10, emissiveIntensity: 0.5 });
const edgeMat = new THREE.LineBasicMaterial({ color: 0x4de8d6, transparent: true, opacity: 0.8 });

const platformGroup = new THREE.Group();
scene.add(platformGroup);

segments.forEach((seg) => {
  const geo = new THREE.BoxGeometry(seg.w, 0.6, seg.d);
  const mesh = new THREE.Mesh(geo, seg.isGoal ? goalPlatformMat : platformMat);
  mesh.position.set(seg.x, -0.3, seg.z);
  mesh.receiveShadow = true;
  platformGroup.add(mesh);

  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
  edges.position.copy(mesh.position);
  platformGroup.add(edges);
});

/* Goal portal ring */
const goalSeg = segments[segments.length - 1];
const portalMat = new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0xffd166, emissiveIntensity: 1.4, roughness: 0.3 });
const portal = new THREE.Mesh(new THREE.TorusGeometry(2, 0.18, 16, 48), portalMat);
portal.position.set(goalSeg.x, 2.2, goalSeg.z);
scene.add(portal);

const portalLight = new THREE.PointLight(0xffd166, 1.2, 20);
portalLight.position.copy(portal.position);
scene.add(portalLight);

/* ---------- Gems ---------- */
const gemGeo = new THREE.OctahedronGeometry(0.35, 0);
const gemMat = new THREE.MeshStandardMaterial({ color: 0xff6b9d, emissive: 0xff6b9d, emissiveIntensity: 1.1, roughness: 0.25, metalness: 0.4 });
const gems = [];

segments.forEach((seg) => {
  if (seg.isGoal) return;
  gemLocalOffsets.forEach((off) => {
    const gem = new THREE.Mesh(gemGeo, gemMat);
    gem.position.set(seg.x + off[0], off[1], seg.z + off[2]);
    gem.castShadow = true;
    gem.userData.baseY = gem.position.y;
    gem.userData.phase = Math.random() * Math.PI * 2;
    scene.add(gem);
    gems.push(gem);
  });
});
const totalGems = gems.length;
let collectedGems = 0;

/* ---------- Obstacles ---------- */
const obstacleGeo = new THREE.BoxGeometry(2.6, 0.4, 0.4);
const obstacleMat = new THREE.MeshStandardMaterial({ color: 0xff6b9d, emissive: 0xff2f6b, emissiveIntensity: 0.6, roughness: 0.4 });
const obstacles = [];

obstacleSegmentIndices.forEach((idx) => {
  const seg = segments[idx];
  const pivot = new THREE.Group();
  pivot.position.set(seg.x, 0.5, seg.z);
  const bar = new THREE.Mesh(obstacleGeo, obstacleMat);
  bar.castShadow = true;
  pivot.add(bar);
  scene.add(pivot);
  obstacles.push({ pivot, bar, speed: 1.1 + Math.random() * 0.5 });
});

/* ---------- Ball ---------- */
const ballRadius = 0.5;
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(ballRadius, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0x4de8d6, emissive: 0x1fbfae, emissiveIntensity: 0.7, roughness: 0.2, metalness: 0.5 })
);
ball.castShadow = true;
const startPos = new THREE.Vector3(segments[0].x, ballRadius, segments[0].z);
ball.position.copy(startPos);
scene.add(ball);

const ballLight = new THREE.PointLight(0x4de8d6, 0.8, 8);
scene.add(ballLight);

let velocity = new THREE.Vector3(0, 0, 0);
let grounded = false;
let checkpoint = startPos.clone();
let checkpointIndex = 0;

/* ---------- Trail ---------- */
const trailPool = [];
const trailGeo = new THREE.SphereGeometry(0.18, 8, 8);
function spawnTrail() {
  const mat = new THREE.MeshBasicMaterial({ color: 0x4de8d6, transparent: true, opacity: 0.5 });
  const m = new THREE.Mesh(trailGeo, mat);
  m.position.copy(ball.position);
  scene.add(m);
  trailPool.push({ mesh: m, life: 0.5 });
}

/* ---------- Input ---------- */
const input = { forward: false, back: false, left: false, right: false, jump: false };

window.addEventListener('keydown', (e) => setKey(e.code, true));
window.addEventListener('keyup', (e) => setKey(e.code, false));
function setKey(code, val) {
  if (code === 'KeyW' || code === 'ArrowUp') input.forward = val;
  if (code === 'KeyS' || code === 'ArrowDown') input.back = val;
  if (code === 'KeyA' || code === 'ArrowLeft') input.left = val;
  if (code === 'KeyD' || code === 'ArrowRight') input.right = val;
  if (code === 'Space') input.jump = val;
}

document.querySelectorAll('.dbtn').forEach((btn) => {
  const dir = btn.dataset.dir;
  const on = (e) => { e.preventDefault(); btn.classList.add('active'); input[dir] = true; };
  const off = (e) => { e.preventDefault(); btn.classList.remove('active'); input[dir] = false; };
  btn.addEventListener('touchstart', on, { passive: false });
  btn.addEventListener('touchend', off, { passive: false });
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
  btn.addEventListener('mouseleave', off);
});

const jumpBtn = document.getElementById('jump-btn');
const jumpOn = (e) => { e.preventDefault(); jumpBtn.classList.add('active'); input.jump = true; };
const jumpOff = (e) => { e.preventDefault(); jumpBtn.classList.remove('active'); input.jump = false; };
jumpBtn.addEventListener('touchstart', jumpOn, { passive: false });
jumpBtn.addEventListener('touchend', jumpOff, { passive: false });
jumpBtn.addEventListener('mousedown', jumpOn);
jumpBtn.addEventListener('mouseup', jumpOff);
jumpBtn.addEventListener('mouseleave', jumpOff);

if ('ontouchstart' in window) {
  document.getElementById('mobile-controls').classList.remove('hidden');
}

/* ---------- Game state ---------- */
let gameState = 'idle'; // idle | playing | won
let elapsed = 0;
let jumpHeld = false;

const gemHud = document.getElementById('gem-count');
const timeHud = document.getElementById('time-count');
const fallToast = document.getElementById('fall-toast');
const startScreen = document.getElementById('start-screen');
const winScreen = document.getElementById('win-screen');
const hud = document.getElementById('hud');

document.getElementById('start-btn').addEventListener('click', () => {
  startScreen.classList.add('hidden');
  hud.classList.remove('hidden');
  gameState = 'playing';
});
document.getElementById('restart-btn').addEventListener('click', resetGame);

function resetGame() {
  ball.position.copy(startPos);
  velocity.set(0, 0, 0);
  checkpoint.copy(startPos);
  checkpointIndex = 0;
  collectedGems = 0;
  elapsed = 0;
  gems.forEach((g) => { if (!g.parent) scene.add(g); });
  updateGemHud();
  winScreen.classList.add('hidden');
  hud.classList.remove('hidden');
  gameState = 'playing';
}

function updateGemHud() { gemHud.textContent = `${collectedGems} / ${totalGems}`; }
updateGemHud();

function showFallToast() {
  fallToast.classList.add('show');
  setTimeout(() => fallToast.classList.remove('show'), 900);
}

/* ---------- Camera follow ---------- */
const camOffset = new THREE.Vector3(0, 4.5, -7);
const camTarget = new THREE.Vector3();

/* ---------- Main loop ---------- */
const clock = new THREE.Clock();
const GRAVITY = -22;
const MOVE_ACCEL = 26;
const MAX_SPEED = 8;
const DAMPING = 6;
const JUMP_SPEED = 8.2;
const FALL_LIMIT = -14;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  gems.forEach((g) => {
    g.rotation.y += dt * 1.6;
    g.position.y = g.userData.baseY + Math.sin(t * 2 + g.userData.phase) * 0.12;
  });
  obstacles.forEach((o) => { o.pivot.rotation.y += dt * o.speed; });
  portal.rotation.z += dt * 0.6;

  if (gameState === 'playing') {
    elapsed += dt;
    timeHud.textContent = `${elapsed.toFixed(1)}s`;

    let ax = 0, az = 0;
    if (input.forward) az += 1;
    if (input.back) az -= 1;
    if (input.left) ax -= 1;
    if (input.right) ax += 1;
    const len = Math.hypot(ax, az);
    if (len > 0) { ax /= len; az /= len; }

    velocity.x += ax * MOVE_ACCEL * dt;
    velocity.z += az * MOVE_ACCEL * dt;
    if (ax === 0) velocity.x -= velocity.x * Math.min(DAMPING * dt, 1);
    if (az === 0) velocity.z -= velocity.z * Math.min(DAMPING * dt, 1);

    const speed = Math.hypot(velocity.x, velocity.z);
    if (speed > MAX_SPEED) {
      const scale = MAX_SPEED / speed;
      velocity.x *= scale; velocity.z *= scale;
    }

    if (input.jump && grounded && !jumpHeld) {
      velocity.y = JUMP_SPEED;
      grounded = false;
    }
    jumpHeld = input.jump;

    velocity.y += GRAVITY * dt;
    ball.position.x += velocity.x * dt;
    ball.position.z += velocity.z * dt;
    ball.position.y += velocity.y * dt;

    if (speed > 0.05) {
      const rollAxis = new THREE.Vector3(-velocity.z, 0, velocity.x).normalize();
      ball.rotateOnWorldAxis(rollAxis, speed * dt * 1.6);
    }

    const support = segments.find((seg) => Math.abs(ball.position.x - seg.x) <= seg.w / 2 && Math.abs(ball.position.z - seg.z) <= seg.d / 2);
    grounded = false;
    if (support && ball.position.y <= ballRadius + 0.02 && velocity.y <= 0) {
      ball.position.y = ballRadius;
      velocity.y = 0;
      grounded = true;
      const idx = segments.indexOf(support);
      if (support.checkpoint && idx > checkpointIndex) {
        checkpointIndex = idx;
        checkpoint.set(support.x, ballRadius, support.z);
      }
    }

    if (Math.random() < 0.6) spawnTrail();

    if (ball.position.y < FALL_LIMIT) {
      ball.position.copy(checkpoint);
      velocity.set(0, 0, 0);
      showFallToast();
    }

    for (let i = gems.length - 1; i >= 0; i--) {
      const g = gems[i];
      if (g.parent && ball.position.distanceTo(g.position) < ballRadius + 0.5) {
        scene.remove(g);
        collectedGems++;
        updateGemHud();
      }
    }

    obstacles.forEach((o) => {
      const barWorldPos = new THREE.Vector3();
      o.bar.getWorldPosition(barWorldPos);
      if (ball.position.distanceTo(barWorldPos) < ballRadius + 1.1) {
        const push = new THREE.Vector3().subVectors(ball.position, o.pivot.position).setY(0);
        if (push.lengthSq() > 0.0001) {
          push.normalize();
          velocity.x += push.x * 6;
          velocity.z += push.z * 6;
          velocity.y = 4;
        }
      }
    });

    if (ball.position.distanceTo(portal.position.clone().setY(ballRadius)) < 2.2) {
      gameState = 'won';
      hud.classList.add('hidden');
      document.getElementById('final-time').textContent = `${elapsed.toFixed(1)}s`;
      document.getElementById('final-gems').textContent = `${collectedGems}/${totalGems}`;
      winScreen.classList.remove('hidden');
    }
  }

  for (let i = trailPool.length - 1; i >= 0; i--) {
    const tr = trailPool[i];
    tr.life -= dt;
    const k = Math.max(tr.life / 0.5, 0);
    tr.mesh.material.opacity = k * 0.5;
    tr.mesh.scale.setScalar(Math.max(k, 0.05));
    if (tr.life <= 0) {
      scene.remove(tr.mesh);
      tr.mesh.material.dispose();
      trailPool.splice(i, 1);
    }
  }

  ballLight.position.copy(ball.position);

  camTarget.set(ball.position.x + camOffset.x, ball.position.y + camOffset.y, ball.position.z + camOffset.z);
  camera.position.lerp(camTarget, 1 - Math.pow(0.001, dt));
  camera.lookAt(ball.position.x, ball.position.y + 0.6, ball.position.z + 3);

  renderer.render(scene, camera);
}

animate();
</script>
